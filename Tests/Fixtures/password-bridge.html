<!doctype html><meta charset="utf-8"><title>Aero Password Bridge Regression</title>
<h1>Password bridge isolation</h1><p id="result">Waiting for bridge test…</p>
<label>Disposable test username <input autocomplete="off"></label>
<label>Disposable test password <input type="password" autocomplete="off"></label>
<script>
window.addEventListener('load', () => {
 setTimeout(() => {
  const exposed = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.aeroPass);
  const helper = typeof window.__aeroPass !== 'undefined';
  document.getElementById('result').textContent = !exposed && !helper
   ? 'PASS: page scripts cannot access the password bridge or autofill helper.'
   : 'FAIL: password bridge or autofill helper is exposed to page scripts.';
 }, 100);
});
</script>
